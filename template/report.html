<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prediction Report</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #7364e3;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
      background: #fff;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px 12px;
      text-align: center;
    }

    th {
      background-color: #89d0ed;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f0f0f0;
    }

    tr:hover {
      background-color: #c8e6c9;
    }
  </style>
</head>

<body>
  <h1>Previous Crop Prediction Reports</h1>

  <table>
    <thead>
      <tr>
        <th>Nitrogen</th>
        <th>Phosphorus</th>
        <th>Potassium</th>
        <th>Temperature</th>
        <th>Humidity</th>
        <th>pH</th>
        <th>Rainfall</th>
        <th>Prediction</th>
      </tr>
    </thead>

    <tbody>
      {% for row in reports %}
      <tr>
        <td>{{ row.Nitrogen }}</td>
        <td>{{ row.Phosphorus }}</td>
        <td>{{ row.Potassium }}</td>
        <td>{{ row.temperature }}</td>
        <td>{{ row.humidity }}</td>
        <td>{{ row.pH }}</td>
        <td>{{ row.rainfall }}</td>
        <td>{{ row.prediction }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

</body>
</html>
